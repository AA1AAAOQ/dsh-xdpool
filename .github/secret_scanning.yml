# Push protection exclusions.
#
# WHY THIS FILE EXISTS
#
# `vendor/channel-pack/` is a third-party bundle we vendor verbatim, not code we
# write. It ships the Gemini login channel's built-in Google OAuth client
# (id + secret) as defaults, overridable at runtime through
# `CMDC_PAK_GOOGLE_CLIENT_ID` / `CMDC_PAK_GOOGLE_CLIENT_SECRET`.
#
# Those two strings belong to the upstream channel-pack author, not to this
# project, and they are already published: the identical file (SHA256
# 18C7629F2E65C894B46E24E95B6DFA45397FA1F4490590A645C1E1058264DAA9) is in the
# public npm tarball `dsh-our-free-model@2.1.0` under `vendor/channel-pack/`.
# Nothing is being leaked here that is not already public.
#
# WHY WE DO NOT JUST EDIT THEM OUT
#
# `src/channels.ts` and `src/status-paths.ts` document this bundle as
# byte-identical to the sibling login-channel build, and that identity is what
# lets the two plugins share one route and hand off cleanly instead of
# double-registering it. Rewriting the file would break that property to hide a
# credential that is public anyway.
#
# SCOPE
#
# One vendored directory, nothing else. Source we author stays fully scanned.
paths-ignore:
  - "vendor/channel-pack/**"
